# 生产一体栈：从 GHCR 拉 stable 镜像（server + worker + web + mysql + backup）
#
#   cp deploy/.env.example .env
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# 数据库迁移由 migrate 一次性服务在 server/worker/backup 启动前自动执行
# （漏跑迁移会让新代码读到旧 schema 直接 500）；如需手动重跑：
#   docker compose -f docker-compose.prod.yml run --rm migrate
#
# 外部 MySQL + 外部 nginx：docker-compose.prod.external.yml
# 本地开发请用 docker-compose.yml（只起 mysql）。

name: moment

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-server-env: &server-env
  NODE_ENV: production
  MYSQL_HOST: mysql
  MYSQL_PORT: '3306'

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - moment-mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    logging: *logging

  # 迁移一次性服务：应用成功后退出；server/worker/backup 门控在它之后。
  # 失败则退出码非零，下游服务不启动——宁可停服也不让新代码读旧 schema。
  migrate:
    image: ghcr.io/ximing/moment-server:${MOMENT_IMAGE_TAG:-stable}
    pull_policy: always
    env_file: .env
    environment:
      <<: *server-env
    command: ['node', 'dist/db/migrate.js']
    restart: 'no'
    depends_on:
      mysql:
        condition: service_healthy
    logging: *logging

  server:
    image: ghcr.io/ximing/moment-server:${MOMENT_IMAGE_TAG:-stable}
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *server-env
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3000/api/health").then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    logging: *logging

  worker:
    image: ghcr.io/ximing/moment-server:${MOMENT_IMAGE_TAG:-stable}
    pull_policy: always
    restart: unless-stopped
    command: ['node', 'dist/worker/index.js']
    env_file: .env
    environment:
      <<: *server-env
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *logging

  backup:
    image: ghcr.io/ximing/moment-backup:${MOMENT_IMAGE_TAG:-stable}
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: '3306'
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *logging

  web:
    image: ghcr.io/ximing/moment-web:${MOMENT_IMAGE_TAG:-stable}
    pull_policy: always
    restart: unless-stopped
    ports:
      - '${MOMENT_HTTP_PORT:-80}:80'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/api/health']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *logging

volumes:
  moment-mysql: {}
