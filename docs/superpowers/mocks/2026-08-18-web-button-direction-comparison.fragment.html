<style>
  #moment-button-directions {
    --m-page: light-dark(#f6f1ec, #171412);
    --m-surface: light-dark(#fffdfb, #26211e);
    --m-surface-soft: light-dark(#f1ebe6, #211c19);
    --m-ink: light-dark(#2b201c, #f7efe9);
    --m-muted: light-dark(#6f5d54, #c3b5ad);
    --m-line: light-dark(#d8c9c0, #463c37);
    --m-action: light-dark(#c94a3a, #ff755e);
    --m-action-hover: light-dark(#b84234, #ff846f);
    --m-action-fg: light-dark(#fffdfb, #241714);
    --m-danger: light-dark(#b83a30, #ff8a72);
    --m-danger-fg: light-dark(#fffdfb, #2b201c);
    --m-focus: light-dark(#7656d8, #b59cff);
    color-scheme: light dark;
    width: 100%;
    color: var(--m-ink);
    font-family:
      system-ui,
      -apple-system,
      "Segoe UI",
      "PingFang SC",
      "Microsoft YaHei",
      sans-serif;
    font-size: var(--font-size-base);
  }

  #moment-button-directions * {
    box-sizing: border-box;
  }

  #moment-button-directions .mbd-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 10px;
  }

  #moment-button-directions .mbd-heading h2,
  #moment-button-directions .mbd-heading p {
    margin: 0;
  }

  #moment-button-directions .mbd-heading p {
    color: var(--m-muted);
  }

  #moment-button-directions .mbd-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    align-items: stretch;
  }

  #moment-button-directions .mbd-direction {
    overflow: hidden;
    min-width: 0;
    border: 1px solid var(--m-line);
    border-radius: 18px;
    background: var(--m-page);
  }

  #moment-button-directions .mbd-direction[data-recommended="true"] {
    border-color: color-mix(in srgb, var(--m-action) 72%, var(--m-line));
  }

  #moment-button-directions .mbd-direction-head {
    display: flex;
    min-height: 64px;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid color-mix(in srgb, var(--m-line) 68%, transparent);
    background: var(--m-surface);
  }

  #moment-button-directions .mbd-direction-name {
    min-width: 0;
  }

  #moment-button-directions .mbd-direction-name strong,
  #moment-button-directions .mbd-direction-name span {
    display: block;
  }

  #moment-button-directions .mbd-direction-name strong {
    font-weight: 500;
  }

  #moment-button-directions .mbd-direction-name span {
    margin-top: 2px;
    color: var(--m-muted);
  }

  #moment-button-directions .mbd-recommend {
    flex: none;
    border-radius: 999px;
    padding: 3px 8px;
    background: color-mix(in srgb, var(--m-action) 13%, transparent);
    color: var(--m-action);
  }

  #moment-button-directions .mbd-scene {
    padding: 14px;
  }

  #moment-button-directions .mbd-scene + .mbd-scene {
    padding-top: 0;
  }

  #moment-button-directions .mbd-scene-label {
    display: block;
    margin-bottom: 8px;
    color: var(--m-muted);
  }

  #moment-button-directions .mbd-composer {
    border: 1px solid var(--m-line);
    border-radius: 16px;
    background: var(--m-surface);
    padding: 12px;
  }

  #moment-button-directions .mbd-composer-copy {
    min-height: 50px;
    color: var(--m-muted);
  }

  #moment-button-directions .mbd-composer-actions,
  #moment-button-directions .mbd-dialog-actions,
  #moment-button-directions .mbd-state-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #moment-button-directions .mbd-composer-actions {
    justify-content: space-between;
  }

  #moment-button-directions .mbd-action-cluster {
    display: flex;
    gap: 6px;
  }

  #moment-button-directions button {
    border: 0;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
    transition:
      background-color 180ms ease,
      color 180ms ease,
      transform 180ms ease;
  }

  #moment-button-directions button:active {
    transform: translateY(1px);
  }

  #moment-button-directions .mbd-btn {
    display: inline-flex;
    min-height: 40px;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 0 15px;
    white-space: nowrap;
  }

  #moment-button-directions .mbd-btn-primary {
    background: var(--m-action);
    color: var(--m-action-fg);
  }

  #moment-button-directions .mbd-btn-primary:hover {
    background: var(--m-action-hover);
  }

  #moment-button-directions .mbd-btn-secondary {
    border: 1px solid var(--m-line);
    background: var(--m-surface);
    color: var(--m-ink);
  }

  #moment-button-directions .mbd-btn-quiet {
    background: transparent;
    color: var(--m-muted);
  }

  #moment-button-directions .mbd-btn-quiet:hover,
  #moment-button-directions .mbd-icon-btn:hover {
    background: color-mix(in srgb, var(--m-ink) 7%, transparent);
    color: var(--m-ink);
  }

  #moment-button-directions .mbd-btn-danger {
    background: var(--m-danger);
    color: var(--m-danger-fg);
  }

  #moment-button-directions .mbd-icon-btn {
    display: inline-flex;
    width: 40px;
    height: 40px;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: var(--m-muted);
  }

  #moment-button-directions .mbd-icon-btn svg,
  #moment-button-directions .mbd-btn svg {
    width: 16px;
    height: 16px;
  }

  #moment-button-directions .mbd-dialog {
    border: 1px solid color-mix(in srgb, var(--m-line) 84%, transparent);
    border-radius: 16px;
    background: var(--m-surface);
    padding: 14px;
    box-shadow: 0 16px 42px color-mix(in srgb, var(--m-ink) 12%, transparent);
  }

  #moment-button-directions .mbd-dialog h3,
  #moment-button-directions .mbd-dialog p {
    margin: 0;
  }

  #moment-button-directions .mbd-dialog h3 {
    font-weight: 500;
  }

  #moment-button-directions .mbd-dialog p {
    min-height: 42px;
    margin-top: 6px;
    color: var(--m-muted);
  }

  #moment-button-directions .mbd-dialog-actions {
    justify-content: flex-end;
    margin-top: 12px;
  }

  #moment-button-directions .mbd-state-row {
    flex-wrap: wrap;
  }

  #moment-button-directions .mbd-state-row .mbd-btn {
    min-height: 36px;
    padding-inline: 12px;
  }

  #moment-button-directions .mbd-btn[data-state="focus"] {
    outline: 2px solid var(--m-focus);
    outline-offset: 2px;
  }

  #moment-button-directions .mbd-btn:disabled {
    cursor: not-allowed;
    opacity: 0.42;
    transform: none;
  }

  #moment-button-directions .mbd-direction[data-shape="balanced"] .mbd-btn {
    border-radius: 11px;
  }

  #moment-button-directions
    .mbd-direction[data-shape="balanced"]
    .mbd-icon-btn {
    border-radius: 50%;
  }

  #moment-button-directions .mbd-direction[data-shape="pill"] .mbd-btn,
  #moment-button-directions .mbd-direction[data-shape="pill"] .mbd-icon-btn {
    border-radius: 999px;
  }

  #moment-button-directions .mbd-direction[data-shape="compact"] .mbd-btn,
  #moment-button-directions .mbd-direction[data-shape="compact"] .mbd-icon-btn {
    border-radius: 6px;
  }

  @media (max-width: 820px) {
    #moment-button-directions .mbd-grid {
      grid-template-columns: 1fr;
    }

    #moment-button-directions .mbd-direction {
      display: grid;
      grid-template-columns: minmax(150px, 0.72fr) minmax(0, 1fr) minmax(
          0,
          1fr
        );
    }

    #moment-button-directions .mbd-direction-head {
      min-height: 100%;
      align-items: flex-start;
      border-right: 1px solid color-mix(in srgb, var(--m-line) 68%, transparent);
      border-bottom: 0;
    }

    #moment-button-directions .mbd-scene {
      padding: 12px;
    }

    #moment-button-directions .mbd-scene + .mbd-scene {
      padding-top: 12px;
      padding-left: 0;
    }

    #moment-button-directions .mbd-scene:last-child {
      display: none;
    }
  }

  @media (max-width: 560px) {
    #moment-button-directions .mbd-heading {
      display: block;
    }

    #moment-button-directions .mbd-heading p {
      margin-top: 3px;
    }

    #moment-button-directions .mbd-direction {
      display: block;
    }

    #moment-button-directions .mbd-direction-head {
      min-height: 0;
      align-items: center;
      border-right: 0;
      border-bottom: 1px solid
        color-mix(in srgb, var(--m-line) 68%, transparent);
    }

    #moment-button-directions .mbd-scene + .mbd-scene {
      padding-top: 0;
      padding-left: 12px;
    }

    #moment-button-directions .mbd-scene:last-child {
      display: block;
    }
  }
</style>
