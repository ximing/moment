# 本地开发库：docker compose up -d mysql
# 生产一体栈（拉 GHCR stable）：docker-compose.prod.yml
# 外部 MySQL + 外部 nginx（拉 GHCR stable）：docker-compose.prod.external.yml
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: moment_root_dev
      MYSQL_DATABASE: moment_dev
      MYSQL_USER: moment
      MYSQL_PASSWORD: moment_dev
    ports:
      - '3306:3306'
    volumes:
      - moment-mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-umoment', '-pmoment_dev']
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file: apps/server/.env
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: '3306'
      LANCEDB_PATH: /data/lancedb
    ports:
      - '3000:3000'
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - moment-lancedb:/data/lancedb

  worker:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    command: ['node', 'dist/worker/index.js']
    env_file: apps/server/.env
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: '3306'
      INTERNAL_API_BASE_URL: http://server:3000
    depends_on:
      mysql:
        condition: service_healthy
      server:
        condition: service_started

  backup:
    build:
      context: ./backup
    restart: unless-stopped
    env_file: apps/server/.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: '3306'
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  moment-mysql: {}
  moment-lancedb: {}
