# 外部 nginx 站点配置（同源：静态页 + /api 反代到本机 3000）
#
#   docker pull ghcr.io/ximing/moment-web:stable
#   id=$(docker create ghcr.io/ximing/moment-web:stable)
#   sudo mkdir -p /var/www/moment
#   docker cp "$id":/usr/share/nginx/html/. /var/www/moment/
#   docker rm "$id"
#   sudo cp deploy/nginx.external.conf /etc/nginx/sites-available/moment
#   sudo ln -sf /etc/nginx/sites-available/moment /etc/nginx/sites-enabled/moment
#   sudo nginx -t && sudo systemctl reload nginx
#
# 改 server_name。HTTPS 用 certbot --nginx 即可。

server {
    listen 80;
    listen [::]:80;
    server_name moment.example.com;

    root /var/www/moment;
    index index.html;

    # 媒体走 S3 预签名，API 本身只有 JSON
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/internal/ {
        return 404;
    }

    # 只匹配对话发送。正则不覆盖 /api/internal/（前缀 404 仍优先落到这条 prefix）。
    # 不用花括号：裸写的 { 会被 nginx 当成 location 块的开头。
    location ~* ^/api/agent/threads/[0-9a-f-]+/turns$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 180s;
        proxy_redirect off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
