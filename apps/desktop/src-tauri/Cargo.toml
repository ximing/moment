[package]
name = "moment-desktop"
version = "0.1.0"
description = "Moment desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "moment_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "moment-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
url = "2"
